version: "3.8"
services:
  api:
    build: .
    environment:
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
      - ADMIN_RELOAD_TOKEN=${ADMIN_RELOAD_TOKEN:-change_me}
      - ENABLE_ADMIN_ENDPOINT=${ENABLE_ADMIN_ENDPOINT:-false}
      - UVIORN_WORKERS=${UVIORN_WORKERS:-1}
    ports:
      - "8000:8000"
    depends_on:
      - embedding-service
  embedding-service:
    # Placeholder for external embedding microservice (optional)
    image: yourorg/embedding-service:latest
    environment:
      - MODEL_NAME=${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
    ports:
      - "8001:8000"
